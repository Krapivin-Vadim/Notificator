services:
  db:
    image: postgres
    restart: always
    ports:
      - ${PG_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - ./pg_data:/var/lib/postgresql/data/pgdata

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--user ${REDIS_USER} on +@all ~* >${REDIS_PASSWORD} --user default off
    restart: unless-stopped

volumes:
  pg_data:
  redis_data: