services:
  db:
    image: postgres
    restart: always
    ports:
      - ${PG_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - ./pg_data:/var/lib/postgresql/data/pgdata


volumes:
  pg_data: